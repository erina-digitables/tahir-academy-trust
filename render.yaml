services:
  - type: web
    name: tahir-academy-trust
    runtime: static
    # Render does not install dependencies separately — its own dashboard
    # default is "npm install; npm run build" — so the install must be part of
    # the command or the build fails with "tailwindcss: not found".
    buildCommand: npm install; npm run build:dist
    staticPublishPath: ./dist
